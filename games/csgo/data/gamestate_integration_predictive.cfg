// CS2 Game State Integration → Predictive Analytics live endpoint.
//
// Install: copy this file to
//   ...\Steam\steamapps\common\Counter-Strike Global Offensive\game\csgo\cfg\
// then launch CS2 and spectate the match (GOTV). The game will POST live state to
// the `uri` below, which our Python API maps to a live win probability.
//
// `allplayers_*` (both teams' economy / who's alive) only arrives when you have
// spectator/GOTV privileges — that's expected. Point `uri` at wherever the Python
// Sports API runs (default port 8100).

"Predictive Analytics CS2 Live"
{
    "uri"       "http://localhost:8100/api/csgo/gsi"
    "timeout"   "5.0"
    "buffer"    "0.1"
    "throttle"  "0.5"
    "heartbeat" "10.0"
    "data"
    {
        "provider"               "1"
        "map"                    "1"
        "round"                  "1"
        "player_id"              "1"
        "player_state"           "1"
        "player_match_stats"     "1"
        "allplayers_id"          "1"
        "allplayers_state"       "1"
        "allplayers_match_stats" "1"
        "bomb"                   "1"
        "phase_countdowns"       "1"
    }
}
